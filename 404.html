<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0b1020; --ink-soft:#475069; --brand:#2f6bff; --brand-2:#00c2a8; --brand-strong:#2a60e6; --line:#e7ebf3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--ink); display:grid; place-items:center; min-height:100vh; text-align:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .mark { width:48px; height:48px; border-radius:13px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); display:grid; place-items:center; color:#fff; font-size:22px; font-weight:900; margin:0 auto 24px; }
  h1 { font-size:clamp(32px,6vw,56px); font-weight:900; letter-spacing:-.02em; margin-bottom:12px; }
  p { color:var(--ink-soft); font-size:17px; margin-bottom:28px; max-width:420px; }
  a.btn { display:inline-flex; align-items:center; gap:8px; background:var(--brand-strong); color:#fff; font-weight:600; padding:13px 24px; border-radius:12px; text-decoration:none; min-height:44px; }
  a.btn:hover { transform:translateY(-2px); }
</style>
</head>
