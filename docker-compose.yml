version: "3.9"

# ─── DUM360 — Local Dev Cluster ─────────────────────────────────────────
#  docker compose up --build

services:
  # ── Infrastructure ────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dum360
      POSTGRES_DB: dum360
      POSTGRES_PASSWORD: dum360
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dum360 -d dum360"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -v red",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  kibana:
    image: kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── DUM360 Services ───────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REGISTRATION_TOKEN: test-token-please-change
      JWT_SECRET: test-jwt-secret-32-bytes-minimum!!
      CORS_ORIGIN: "*"
      REGISTRY_HOST: registry
      ORCHESTRATION_HOST: orchestration
      LOG_HOST: log
    depends_on:
      registry:
        condition: service_healthy
      orchestration:
        condition: service_healthy
      log:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health 2>/dev/null | grep -q healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    # Internal service — reachable only via the gateway on the compose network.
    # Not published to the host (the gateway is the sole authenticated entry point).
    expose:
      - "8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://dum360:dum360@postgres:5432/dum360
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: test-jwt-secret-32-bytes-minimum!!
      REGISTRATION_TOKEN: test-token-please-change
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/health 2>/dev/null | grep -q healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestration:
    build:
      context: .
      dockerfile: services/orchestration/Dockerfile
    # Internal service — not published to the host. The node-facing /tasks/next
    # endpoint trusts x-node-id, which the gateway sets from the verified JWT;
    # keeping this off the host prevents direct, unauthenticated impersonation.
    expose:
      - "8082"
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://dum360:dum360@postgres:5432/dum360
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: test-jwt-secret-32-bytes-minimum!!
      NODE_ENV: development
      # Per-task GitHub credentials. Prefer a GitHub App (scoped, revocable);
      # GITHUB_TOKEN is a dev-only static fallback. With none set, task
      # assignment fails closed (no shared placeholder token).
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/health 2>/dev/null | grep -q healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  log:
    build:
      context: .
      dockerfile: services/log/Dockerfile
    # Internal service — reachable only via the gateway on the compose network.
    expose:
      - "8083"
    environment:
      PORT: "8083"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORS_ORIGIN: "*"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/health 2>/dev/null | grep -q healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Node Agents ───────────────────────────────────────────────────────

  node-1:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    environment:
      SERVER_URL: http://gateway:8080
      NODE_NAME: node-1
      REGISTRATION_TOKEN: test-token-please-change
      AI_PROVIDER: claude
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "9091:9090"
    # Docker executor needs a daemon. MVP mounts the host socket — note this
    # gives the node broad host privileges (sibling containers). DinD is a
    # hardening follow-up.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gateway:
        condition: service_healthy

  node-2:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    environment:
      SERVER_URL: http://gateway:8080
      NODE_NAME: node-2
      REGISTRATION_TOKEN: test-token-please-change
      AI_PROVIDER: claude
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "9092:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  esdata:
